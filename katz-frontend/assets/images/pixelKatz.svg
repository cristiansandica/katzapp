<svg width="256" height="256" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Outline and ears -->
  <rect x="8" y="4" width="2" height="1" fill="#111" />
  <rect x="22" y="4" width="2" height="1" fill="#111" />
  <rect x="7" y="5" width="1" height="1" fill="#111" />
  <rect x="9" y="5" width="1" height="1" fill="#111" />
  <rect x="22" y="5" width="1" height="1" fill="#111" />
  <rect x="24" y="5" width="1" height="1" fill="#111" />

  <!-- Head top and stripes -->
  <rect x="13" y="6" width="1" height="2" fill="#111" />
  <rect x="15" y="6" width="1" height="2" fill="#111" />
  <rect x="17" y="6" width="1" height="2" fill="#111" />

  <!-- Face outline -->
  <rect x="6" y="8" width="1" height="1" fill="#111" />
  <rect x="25" y="8" width="1" height="1" fill="#111" />
  <rect x="6" y="9" width="1" height="1" fill="#111" />
  <rect x="25" y="9" width="1" height="1" fill="#111" />
  <rect x="7" y="10" width="1" height="1" fill="#111" />
  <rect x="24" y="10" width="1" height="1" fill="#111" />

  <!-- Eyes -->
  <rect x="11" y="12" width="2" height="2" fill="#111" />
  <rect x="19" y="12" width="2" height="2" fill="#111" />
  <rect x="12" y="13" width="1" height="1" fill="white" />
  <rect x="20" y="13" width="1" height="1" fill="white" />

  <!-- Nose and mouth -->
  <rect x="15" y="15" width="2" height="1" fill="#111" />
  <rect x="13" y="16" width="1" height="1" fill="#111" />
  <rect x="14" y="17" width="1" height="1" fill="#111" />
  <rect x="15" y="17" width="1" height="1" fill="#111" />
  <rect x="16" y="17" width="1" height="1" fill="#111" />
  <rect x="17" y="16" width="1" height="1" fill="#111" />
  <rect x="18" y="17" width="1" height="1" fill="#111" />

  <!-- Whiskers -->
  <rect x="5" y="13" width="1" height="1" fill="#111" />
  <rect x="5" y="15" width="1" height="1" fill="#111" />
  <rect x="5" y="17" width="1" height="1" fill="#111" />
  <rect x="26" y="13" width="1" height="1" fill="#111" />
  <rect x="26" y="15" width="1" height="1" fill="#111" />
  <rect x="26" y="17" width="1" height="1" fill="#111" />

  <!-- Shadow on right side -->
  <rect x="23" y="13" width="1" height="1" fill="#ccc" />
  <rect x="24" y="14" width="1" height="1" fill="#ccc" />
  <rect x="25" y="15" width="1" height="1" fill="#ccc" />
  <rect x="24" y="16" width="1" height="1" fill="#ccc" />
</svg>